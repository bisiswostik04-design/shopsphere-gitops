apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: shopsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: notification-service
          image: ghcr.io/bisiswostik04-design/shopsphere-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5005
          env:
            - name: PORT
              value: "5005"
            - name: MONGO_URL
              value: "mongodb://$(MONGO_HOST):$(MONGO_PORT)/$(MONGO_DATABASE)_notifications"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopsphere-secret
                  key: JWT_SECRET
          envFrom:
            - configMapRef:
                name: shopsphere-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5005
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5005
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: shopsphere
spec:
  selector:
    app: notification-service
  ports:
    - port: 5005
      targetPort: 5005
  type: ClusterIP
