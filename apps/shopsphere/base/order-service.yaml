apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: shopsphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: order-service
          image: ghcr.io/bisiswostik04-design/shopsphere-order-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5003

          env:
            - name: PORT
              value: "5003"

            - name: MONGO_URL
              value: "mongodb://$(MONGO_HOST):$(MONGO_PORT)/$(MONGO_DATABASE)_orders"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopsphere-secret
                  key: JWT_SECRET

          envFrom:
            - configMapRef:
                name: shopsphere-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5003
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5003
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: shopsphere
spec:
  selector:
    app: order-service
  ports:
    - port: 5003
      targetPort: 5003
  type: ClusterIP
